version: '3.8'

services:
  web:
    build: .
    command: gunicorn pet_care_management.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

